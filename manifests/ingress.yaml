# Requires an installed Ingress Controller and a matching IngressClass.
# This example assumes the nginx-service in namespace k8s-demo exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: k8s-demo
spec:
  ingressClassName: nginx
  rules:
    - host: nginx.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
