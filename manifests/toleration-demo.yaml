apiVersion: v1
kind: Pod
metadata:
  name: toleration-demo
  namespace: k8s-demo
spec:
  # This requires k8s-worker1 to carry label kubernetes.io/hostname=k8s-worker1
  # and the matching workload=special:NoSchedule taint.
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1
  tolerations:
    - key: workload
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: web
      image: nginx:1.28
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 150m
          memory: 96Mi
