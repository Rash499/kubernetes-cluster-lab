# LAB ONLY: /mnt/k8s-data must exist on the specific node selected below.
# hostPath is node-local and is not suitable as resilient production storage.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: k8s-local-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-local
  local:
    path: /mnt/k8s-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-pvc
  namespace: k8s-demo
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual-local
  resources:
    requests:
      storage: 500Mi
  volumeName: k8s-local-pv
