# CAUTION: only use an IP range reserved for this cluster and excluded from DHCP.
# Notion recorded 192.168.6.200-192.168.6.210; verify it is still unused before applying.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: first-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.6.200-192.168.6.210
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: first-advertisement
  namespace: metallb-system
spec:
  ipAddressPools:
    - first-pool
